<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediBot 🩺 - AI First-Aid Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- ADD THIS LINE -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="chat-app-container">
        <!-- HEADER -->
        <header class="app-header">
            <div class="logo">
                <div id="header-avatar-container" class="header-avatar-container">
                    <img src="/static/images/thinking.jpg" alt="MediBot Thinking" class="header-avatar">
                    <div class="thinking-spinner"></div>
                </div>
                <h1>MediBot</h1>
            </div>
            <!-- NEW: New Chat Button -->
            <button id="new-chat-btn" class="new-chat-button" title="Start a new chat">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
                <span>New Chat</span>
            </button>
        </header>

        <!-- CHAT LOG -->
        <main class="chat-log" id="chat-log"></main>

        <!-- STOP GENERATING BUTTON -->
        <div class="stop-generating-wrapper" id="stop-btn-container" style="display: none;">
            <button id="stop-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"></path></svg>
                Stop generating
            </button>
        </div>

        <!-- INPUT AREA -->
        <footer class="input-area">
            <form class="input-form" id="question-form">
                <input type="text" id="question-input" placeholder="Ask MediBot a first-aid question..." autocomplete="off">
                <button type="submit" id="send-btn" title="Send message">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>
            <p class="disclaimer">MediBot is an AI assistant. This is not medical advice. For serious emergencies, please call emergency services.</p>
        </footer>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
